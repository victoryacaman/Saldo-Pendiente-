<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saldo pendiente — Capítulo 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#e9e2d2; --page-ink:#1c1733;
  --ink:#100d22; --ink-2:#17143a; --win:#0b3c8c; --win-dark:#08275c;
  --line:#ffffff; --txt:#f7f4ea; --gold:#f2c14e; --pos:#7fdc9a; --neg:#ff7a70; --mute:#aab4ee;
  --pixel:'Press Start 2P',ui-monospace,monospace; --body:'VT323',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0a0812;--page-ink:#e8e4f4}}
:root[data-theme="dark"]{--page:#0a0812;--page-ink:#e8e4f4}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--page);color:var(--page-ink);font-family:var(--body);font-size:22px;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--ink);color:var(--txt);overflow:hidden;border-left:3px solid #000;border-right:3px solid #000}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* HUD */
.hud{flex:none;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 10px;background:#0a0818;border-bottom:3px solid #2b2556}
.cash{font:12px/1 var(--pixel);color:var(--gold);white-space:nowrap}
.bars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bar{min-width:0}
.bar span{display:block;font-size:17px;line-height:1;color:var(--mute);margin-bottom:2px}
.bar i{display:block;height:8px;background:#26224a;border:2px solid #000;outline:1px solid #3c3670}
.bar b{display:block;height:100%;width:50%;background:var(--pos);transition:width .5s steps(8)}
.bar.est b{background:#ffb347}
.bar.est.hi b{background:var(--neg)}
.bar.fam b{background:#6cc1ff}
.estado{font:9px/1 var(--pixel);padding:9px 8px;background:var(--win);border:2px solid #fff;color:#fff;cursor:pointer;border-radius:2px}

/* Stage */
.stage{position:relative;flex:none;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;border-bottom:3px solid #2b2556}
.stage canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.stage canvas.fade{animation:fade .45s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
.spots{position:absolute;inset:0}
.spot{position:absolute;width:48px;height:48px;transform:translate(-50%,-50%);padding:0;border:0;background:none;cursor:pointer}
.spot::before{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;background:var(--gold);box-shadow:0 0 0 2px #000,0 0 0 4px rgba(255,255,255,.55);animation:ping 1.1s steps(2) infinite}
.spot.done::before{background:#8f93b5;animation:none;box-shadow:0 0 0 2px #000}
.spot .lbl{position:absolute;left:50%;top:calc(50% + 12px);transform:translateX(-50%);font-size:17px;line-height:1;padding:2px 5px;background:rgba(0,0,0,.78);color:#fff;white-space:nowrap}
@keyframes ping{50%{transform:scale(1.35)}}
.cap{position:absolute;left:50%;top:9%;transform:translateX(-50%);max-width:92%;font:9px/1.6 var(--pixel);padding:7px 10px;background:rgba(0,0,0,.78);border:2px solid #fff;color:#fff;text-align:center;pointer-events:none;animation:cap 3.6s forwards}
@keyframes cap{0%{opacity:0}8%{opacity:1}78%{opacity:1}100%{opacity:0}}
.toasts{position:absolute;right:6px;bottom:6px;display:flex;flex-direction:column;align-items:flex-end;gap:3px;pointer-events:none}
.chip{font-size:19px;line-height:1;padding:3px 8px;background:rgba(0,0,0,.82);border:2px solid var(--mute);color:#fff;animation:chip 3s forwards}
.chip.pos{border-color:var(--pos);color:var(--pos)}
.chip.neg{border-color:var(--neg);color:var(--neg)}
.chip.rel{border-color:var(--gold);color:var(--gold)}
@keyframes chip{0%{opacity:0;transform:translateY(6px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

/* Panel */
.panel{flex:1;min-height:0;overflow-y:auto;padding:22px 12px 14px;background:linear-gradient(#17143a,#0e0b22);cursor:pointer}
.box{position:relative;min-height:130px;padding:16px 14px 24px;background:var(--win);border:3px solid var(--line);border-radius:4px;box-shadow:0 0 0 3px #000,5px 5px 0 3px rgba(0,0,0,.45)}
.box .name{position:absolute;top:-17px;left:10px;font:10px/1 var(--pixel);padding:7px 9px;background:var(--c,#5b6178);color:#fff;border:3px solid #fff;box-shadow:0 0 0 2px #000}
.txt{font-size:27px;line-height:1.12;white-space:pre-wrap;min-height:2.3em}
.arrow{position:absolute;right:10px;bottom:5px;font-size:20px;color:var(--gold);animation:blink .9s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.box.narr{background:#0a0d2c;border-color:#c9d3ff}
.box.narr .txt{color:#e3e9ff}
.box.cine{background:transparent;border:0;box-shadow:none;text-align:center;display:flex;align-items:center;justify-content:center}
.box.cine .txt{font-size:30px;color:#fff}
.box.nota{background:#f2e8cf;border:3px solid #6b4b2a;box-shadow:0 0 0 3px #000,5px 5px 0 3px rgba(0,0,0,.45);min-height:90px}
.box.nota .txt{color:#2c1c10;font-size:29px;text-align:center}
.box.nota .arrow{color:#6b4b2a}
.box.msg{background:transparent;border:0;box-shadow:none;padding:0 0 22px;min-height:110px}
.who{font:9px/1 var(--pixel);color:var(--gold);margin-bottom:8px}
.bubble{display:inline-block;max-width:92%;padding:11px 14px;background:#2d3560;border:3px solid #fff;box-shadow:0 0 0 3px #000;border-radius:3px 12px 12px 12px}
.bubble .txt{font-size:26px;min-height:0}
.self{text-align:right}
.self .bubble{background:#1f6b45;border-radius:12px 3px 12px 12px;text-align:left}
.phone{margin:6px auto 0;width:min(100%,330px);padding:16px 12px 24px;background:#07060f;border:4px solid #8f93b5;border-radius:14px;box-shadow:0 0 0 3px #000;position:relative}
.phone h4{margin:0 0 10px;font:9px/1.5 var(--pixel);color:var(--gold)}
.phone p{margin:0 0 4px;font-size:27px;line-height:1.1;color:#dff4ff}
.phone .pay{margin-top:12px;padding:10px;text-align:center;font:12px/1 var(--pixel);background:#2faa68;border:3px solid #fff;color:#fff}
.phone .arrow{bottom:4px}
.card{margin:6px auto 0;width:min(100%,340px);padding:16px 16px 26px;background:#f2e8cf;color:#2c1c10;border:3px dashed #6b4b2a;box-shadow:0 0 0 3px #000;position:relative}
.card h4{margin:0 0 10px;font:9px/1.5 var(--pixel)}
.card .row{display:flex;justify-content:space-between;font-size:26px;line-height:1.15}
.card .tot{display:flex;justify-content:space-between;font-size:30px;margin-top:8px;padding-top:6px;border-top:3px solid #2c1c10}
.card .arrow{color:#6b4b2a}
.card.news{background:#ece6d4;border:3px solid #2a2a2a;padding-bottom:30px}
.news h4{margin:0 0 10px;padding-bottom:8px;border-bottom:3px solid #2a2a2a;line-height:1.7}
.news .hl{margin-bottom:8px;font-size:33px;line-height:.98;color:#16130e}
.news .bj{margin:0;font-size:25px;line-height:1.08;color:#3a3228}
.titlecard{text-align:center;padding:30px 6px}
.titlecard h1{margin:0 0 14px;font:16px/1.7 var(--pixel);color:var(--gold)}
.titlecard p{margin:0;font-size:28px;line-height:1.1;color:#fff}
.titlecard .arrow{position:static;display:block;margin-top:18px}

/* choices */
.q{margin:0 0 6px;font:12px/1.7 var(--pixel);color:var(--gold)}
.hint{margin:0 0 12px;font-size:21px;line-height:1.05;color:var(--mute)}
.opt{display:block;width:100%;margin:0 0 11px;padding:11px 13px;text-align:left;background:var(--win);color:#fff;border:3px solid #fff;border-radius:4px;box-shadow:0 0 0 3px #000;cursor:pointer;min-height:56px}
.opt:active{transform:translate(2px,2px)}
.opt .lab{display:block;font-size:26px;line-height:1.05}
.opt .cost{display:block;margin-top:5px;font-size:20px;line-height:1.05;color:#ffe08a}
.opt .dev{display:block;margin-top:4px;font-size:17px;line-height:1.05;color:#9fe0ff}
.opt .why{display:block;margin-top:5px;font-size:20px;color:#ffaaa3}
.opt[disabled]{opacity:.6;cursor:not-allowed;background:#1d2342;border-color:#7a82aa}
.opt.exit{background:#6a4a00;border-color:var(--gold)}
.opt.exit[disabled]{background:#2a2540;border-color:#6a6490}
.obj{margin:0 0 12px;padding:11px 13px;background:#0a0d2c;border:3px solid #c9d3ff;box-shadow:0 0 0 3px #000}
.obj b{display:block;font:9px/1.6 var(--pixel);color:var(--gold);font-weight:400;margin-bottom:6px}
.obj span{font-size:26px;line-height:1.05}
.tip{margin:0 0 12px;font-size:20px;color:var(--mute)}

/* title / end */
.menu{text-align:center;padding-top:4px}
.menu h1{margin:0 0 6px;font:19px/1.5 var(--pixel);color:var(--gold);text-shadow:3px 3px 0 #000}
.menu .sub{margin:0 0 18px;font-size:25px;color:#fff}
.menu .small{margin:14px 0 0;font-size:18px;line-height:1.1;color:var(--mute)}
.menu .opt{text-align:center}
.recap{margin:0;padding:0;list-style:none}
.recap li{display:flex;justify-content:space-between;gap:10px;font-size:25px;line-height:1.15;padding:3px 0;border-bottom:2px dotted rgba(255,255,255,.28)}
.recap li:last-child{border-bottom:0}
.recap em{font-style:normal;color:#ffe08a;text-align:right}
.recap .sec{display:block;font:9px/1.6 var(--pixel);color:var(--gold);border:0;padding-top:10px}
.pos{color:var(--pos)}.neg{color:var(--neg)}

/* estado */
.sheet{position:absolute;inset:0;z-index:30;display:none;padding:16px 14px;overflow:auto;background:rgba(8,6,20,.97)}
.sheet.open{display:block}
.sheet h2{margin:0 0 10px;font:12px/1.5 var(--pixel);color:var(--gold)}
.sheet pre{white-space:pre-wrap;font-size:17px;color:#9fe0ff}
.sheet .opt{margin-top:14px;text-align:center}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.cap{opacity:1}}
@media (min-width:521px){body{display:flex;align-items:stretch}#app{width:520px}}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="cash" id="cash">L 3,850</div>
    <div class="bars" aria-label="Estado">
      <div class="bar edu"><span>Educación</span><i><b id="b-edu"></b></i></div>
      <div class="bar fam"><span>Familia</span><i><b id="b-fam"></b></i></div>
      <div class="bar est"><span>Estrés</span><i><b id="b-est"></b></i></div>
    </div>
    <button class="estado" id="btn-estado" type="button">Estado</button>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" width="160" height="90" aria-label="Escena del juego"></canvas>
    <div class="spots" id="spots"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
  </div>
  <main class="panel" id="panel"></main>
  <section class="sheet" id="sheet" aria-label="Estado de Carlos"></section>
</div>

<script>
const STORY = {"_leyenda":{"pasos":{"bg":"Cambia el fondo y los personajes visibles. Campos: bg, chars [{id,x,y}], caption (rótulo de lugar/hora).","chars":"Cambia solo los personajes en pantalla.","narr":"Texto narrativo. kind opcional: cine | nota.","say":"Línea de diálogo: who, text.","msg":"Mensaje de teléfono: who, text. who 'Carlos' se muestra como mensaje enviado.","phone":"Tarjeta de teléfono: title, lines, button (opcional).","news":"Recorte de periódico: section, title, text.","card":"Tarjeta tipo recibo: title, lines [[concepto, monto]], total [concepto, monto].","title":"Pantalla de título: text, sub.","explore":"Escena tocable: objective, spots [{id,label,x,y,steps}], exit {label, requires:[ids]}. x,y en una rejilla de 160x90.","choice":"Decisión: id, prompt, hint, options [{label, costo, fx, when, whenText, goto}].","fx":"Aplica efectos sin elegir nada.","if":"cond, then [pasos], else [pasos].","goto":"Salta a otra escena (guarda punto de control).","recap":"Resumen de estado del jugador.","end":"Fin del capítulo (pantalla final y compartir resultado)."},"efectos_fx":{"add":"Suma o resta a variables. Ej: {\"cash\": -3500}.","set":"Asigna valor. Ej: {\"deuda_univ\": 500}.","flags":"Asigna banderas. Ej: {\"univ\": \"paid\"}."},"condiciones":"{flag, eq|ne} · {var, gte|lte|gt|lt|eq} · {all:[...]} · {any:[...]} · {not:{...}}","nota_de_produccion":"Los titulares de la parada del bus (escena bus) están inspirados en reportajes de 2026 sobre salud, pueblos garífunas, empleo juvenil y migración; están redactados en forma general. La cifra de 36,000 retornados corresponde a enero-septiembre de 2026: verificar y actualizar antes de publicar. Los montos de pago quincenal, la fecha del vencimiento (jueves a viernes) y los textos puente marcados con _nuevo son decisiones del prototipo que no estaban en el guion original. Ajustar aquí."},"meta":{"titulo":"Saldo pendiente","capitulo":1,"inicio":"cine"},"voces":{"_nota":"Guía de voz para mantener el habla consistente en los próximos capítulos. Una o dos expresiones por línea como máximo: que se sientan, no que se noten. El léxico cambia por región y edad; validar con hablantes de San Pedro Sula.","todos":"Voseo (vos, mirá, podés, tratés, ayudás) y 'pues' al final de frases. 'Pena' significa vergüenza.","Carlos":"Estudiante y trabajador de 20 años. Mezcla el registro de clase con el de calle: pisto, chamba, cheque. Le dice 'ma' a su mamá y llama a Pablo por su nombre.","Pablo":"El más suelto del grupo: cheque, va pues, alero. Llama a sus amigos por su nombre. Bromea para bajar la presión sin presionar.","Fabiana":"Directa y práctica, también trabaja y estudia: pisto, raite, mirá. Usa el nombre de la persona cuando quiere sonar cercana.","Victoria":"Mamá de unos 40 años: mijo, pisto, ahorita. Mezcla cariño con regaño y humor para no llorar.","Helena":"Diez años: voseo y 'pues', sin jerga fuerte. Habla directo, como los cipotes.","Encargado":"Jefe del súper: 'va pues', 'cheque', trato cercano pero con límites claros.","_glosario_nota":"Se evita la palabra más coloquial para 'amigo': los personajes se llaman por su nombre, pensando en públicos jóvenes. No va en el glosario ni en los diálogos.","glosario":{"pisto":"dinero","cheque":"está bien, de acuerdo","chamba":"trabajo, empleo","cipote/a":"niño o niña, joven","alero":"amigo cercano","raite":"aventón, viaje gratis en carro","va pues / vaya pues":"está bien, de acuerdo, hasta luego","ahorita":"en un momento","mijo":"mi hijo, cariñoso"}},"config":{"vars":{"cash":3850,"ahorro":0,"deuda_univ":0,"deuda_salarial":0,"deuda_familiar":0,"educacion":60,"familia":65,"estres":35,"rel_pablo":50,"rel_fabiana":0,"conocimiento":0,"carrera":0,"datos":10,"ahorro_familiar":1500,"pago_quincenal":2200},"flags":{"univ":"al_dia","ruta":"","conoce_fabiana":false,"practica":false,"respuesta":"","silenciada":false,"adelanto":false,"victoria_pago":false,"helena_materiales":false}},"mapa_consecuencias":[{"si":{"flag":"univ","eq":"paid"},"entonces":"Universidad pagada: conserva acceso, pero puede quedar sin efectivo."},{"si":{"flag":"univ","eq":"parcial"},"entonces":"Pago parcial: debe encontrar L 700 antes de que aumente la presión."},{"si":{"flag":"univ","eq":"vencido"},"entonces":"Pago pospuesto: conserva liquidez, pero arriesga continuidad académica."},{"si":{"flag":"conoce_fabiana"},"entonces":"Conoció a Fabiana: desbloquea una práctica y una relación nueva."},{"si":{"flag":"ruta","eq":"A"},"entonces":"No salió: Pablo demuestra que la amistad no depende de una sola cena."},{"si":{"flag":"silenciada"},"entonces":"Silenció la llamada: Helena no recupera inmediatamente la confianza."},{"si":{"flag":"adelanto"},"entonces":"Adelanto salarial: tres pagos futuros llegan reducidos en L 500."},{"si":{"flag":"victoria_pago"},"entonces":"Victoria pagó: el alquiler, el transporte o los materiales de Helena quedan expuestos."},{"si":{"var":"deuda_familiar","gt":0},"entonces":"Deuda familiar: futuras discusiones pueden mezclar cariño, culpa y dinero."},{"si":{"flag":"adelanto"},"entonces":"Turnos adicionales: Carlos puede ganar más, pero perder tiempo de estudio y familia."}],"escenas":{"cine":{"steps":[{"t":"bg","bg":"negro"},{"t":"title","text":"Capítulo 1","sub":"Saldo pendiente"},{"t":"narr","kind":"cine","text":"Se escuchan fragmentos breves y superpuestos: una radio anunciando una feria de empleo, el ruido de una fábrica, una impresora sacando currículums, una multitud esperando que abran unas puertas."},{"t":"bg","bg":"fila"},{"t":"narr","kind":"cine","text":"Jóvenes sostienen carpetas bajo el sol."},{"t":"narr","kind":"cine","text":"Un anuncio dice: “Se requiere experiencia.”"},{"t":"narr","kind":"cine","text":"Una muchacha cuenta las últimas monedas para sacar una fotocopia."},{"t":"bg","bg":"fabrica"},{"t":"narr","kind":"cine","text":"Una fábrica enciende sus luces antes del amanecer."},{"t":"phone","title":"Solicitud de empleo","lines":["Solicitud recibida.","Nos comunicaremos con usted."]},{"t":"bg","bg":"fila"},{"t":"narr","kind":"cine","text":"En un sueño, Carlos camina detrás de una fila que nunca avanza. Cuando por fin llega al frente, la puerta se cierra."},{"t":"bg","bg":"negro"},{"t":"narr","kind":"cine","text":"Suena una alarma."},{"t":"goto","scene":"habitacion"}]},"habitacion":{"steps":[{"t":"bg","bg":"habitacion","chars":[{"id":"carlos","x":80,"y":84}],"caption":"6:08 a. m."},{"t":"narr","text":"Carlos despierta. Tiene 20 años, estudia Finanzas y Administración y trabaja por las tardes en un supermercado. Vive con su madre, Victoria, y su hermana Helena, de diez años."},{"t":"explore","objective":"Prepararte para ir a la universidad.","spots":[{"id":"telefono","label":"Teléfono","x":106,"y":50,"steps":[{"t":"phone","title":"Universidad","lines":["Saldo pendiente: L 3,500.","Vence mañana, 5:00 p. m."]}]},{"id":"uniforme","label":"Uniforme","x":27,"y":26,"steps":[{"t":"say","who":"Carlos","text":"Otra vez me toca cerrar esta noche. Pura chamba."}]},{"id":"sobre","label":"Sobre","x":118,"y":51,"steps":[{"t":"narr","text":"Un sobre vacío. Antes guardaba pisto para emergencias."}]},{"id":"foto","label":"Fotografía","x":112,"y":25,"steps":[{"t":"narr","text":"En la fotografía aparece el padre de Carlos. La esquina está doblada."},{"t":"narr","text":"Carlos no dice qué ocurrió. Todavía."}]},{"id":"cuaderno","label":"Cuaderno","x":134,"y":51,"steps":[{"t":"narr","text":"Un presupuesto incompleto. En la última línea, a lápiz:"},{"t":"narr","kind":"nota","text":"Cuando me paguen mejor, empiezo a ahorrar."}]}],"exit":{"label":"Salir del cuarto"}},{"t":"goto","scene":"cocina"}]},"cocina":{"steps":[{"t":"bg","bg":"cocina","chars":[{"id":"helena","x":118,"y":72},{"id":"victoria","x":42,"y":78},{"id":"carlos","x":78,"y":84}],"caption":"Cocina"},{"t":"say","who":"Helena","text":"¿Me ayudás con esta tarea cuando regresés, pues?"},{"t":"say","who":"Carlos","text":"Si no llego muy tarde del súper, sí."},{"t":"say","who":"Helena","text":"Siempre decís eso."},{"t":"narr","text":"Carlos sonríe, pero la frase le pesa."},{"t":"narr","text":"Victoria prepara café antes de ir a una fábrica textil, donde trabaja como auxiliar de inventario. Se nota cansada, pero no indefensa: revisa una lista, corrige un error y guarda un recipiente con almuerzo."},{"t":"say","who":"Victoria","text":"¿Ya revisaste lo de la mensualidad?"},{"t":"say","who":"Carlos","text":"Hoy lo hago."},{"t":"say","who":"Victoria","text":"Eso dijiste ayer."},{"t":"say","who":"Carlos","text":"He estado trabajando y estudiando, ma. No se me olvidó."},{"t":"say","who":"Victoria","text":"No te estoy diciendo que no hagás nada. Te estoy diciendo que no dejés que la pena te haga ignorar una cuenta."},{"t":"say","who":"Carlos","text":"No es pena."},{"t":"narr","text":"Victoria lo mira. Los dos saben que sí lo es."},{"t":"say","who":"Victoria","text":"Si no te ajusta el pisto, lo hablamos, mijo. Pero lo hablamos antes del vencimiento, no después."},{"t":"say","who":"Carlos","text":"Yo lo resuelvo, ma."},{"t":"narr","text":"Victoria le entrega una baleada envuelta para el camino."},{"t":"say","who":"Victoria","text":"Está bien, mijo. Solo no tratés de resolver todo solo."},{"t":"narr","text":"Carlos guarda el desayuno y sale."},{"t":"goto","scene":"bus"}]},"bus":{"steps":[{"t":"bg","bg":"parada","chars":[{"id":"carlos","x":82,"y":74},{"id":"senora","x":104,"y":74},{"id":"muchacho","x":130,"y":74}],"caption":"La parada"},{"t":"explore","objective":"Llegar a la universidad.","spots":[{"id":"salud","label":"Salud","x":21,"y":37,"steps":[{"t":"news","section":"Salud","title":"Hospitales públicos: faltan medicinas y quirófanos","text":"Médicos y pacientes denuncian desabastecimiento. Muchas familias compran insumos por su cuenta."},{"t":"say","who":"Carlos","text":"Aquí uno no se puede dar el lujo de enfermarse."}]},{"id":"pueblos","label":"Pueblos","x":55,"y":37,"steps":[{"t":"news","section":"Pueblos indígenas y afrohondureños","title":"Comunidades garífunas denuncian desalojos","text":"Exigen que se cumplan las sentencias internacionales que protegen sus tierras ancestrales."},{"t":"narr","text":"En la ciudad, la noticia pasa rápido. Para quienes la viven, no pasa."}]},{"id":"empleo","label":"Empleo","x":21,"y":53,"steps":[{"t":"news","section":"Empleo","title":"Más jóvenes con estudios, pocos empleos formales","text":"El subempleo supera al desempleo: mucha gente trabaja, pero el ingreso no alcanza. Muchas plazas piden experiencia."},{"t":"say","who":"Carlos","text":"Piden experiencia para darte tu primera experiencia."}]},{"id":"migracion","label":"Migración","x":55,"y":53,"steps":[{"t":"news","section":"Migración","title":"Migrar sigue siendo la salida para muchos jóvenes","text":"Más de 36,000 hondureños han regresado al país en lo que va de 2026, casi todos desde Estados Unidos. Las remesas sostienen a miles de hogares."},{"t":"say","who":"Carlos","text":"Todos conocemos a alguien que ya se fue."}]},{"id":"senora","label":"Señora","x":104,"y":58,"steps":[{"t":"say","who":"Señora","text":"Mi cipote me manda el pisto del mes desde allá. Ojalá no lo manden de vuelta."}]},{"id":"muchacho","label":"Muchacho","x":130,"y":58,"steps":[{"t":"say","who":"Muchacho","text":"Ando buscando chamba. Llevo meses dejando currículums y nadie llama."}]}],"exit":{"label":"Subir al bus"}},{"t":"bg","bg":"bus","chars":[{"id":"carlos","x":80,"y":78}],"caption":"En el bus"},{"t":"narr","text":"Dentro del bus, Carlos abre el portal universitario. El botón PAGAR queda en el centro de la pantalla."},{"t":"phone","title":"Portal universitario","lines":["Saldo pendiente: L 3,500","Vence mañana, 5:00 p. m."],"button":"PAGAR"},{"t":"narr","text":"Carlos no lo presiona."},{"t":"msg","who":"Pablo","text":"Carlos, ramen el sábado. Van varios de la clase. ¿Te apuntás?"},{"t":"msg","who":"Turnos","text":"El horario de la próxima semana se enviará por el grupo. Confirmar disponibilidad antes del domingo."},{"t":"narr","text":"Carlos mira el indicador de datos móviles: le queda muy poco saldo."},{"t":"goto","scene":"universidad"}]},"universidad":{"steps":[{"t":"bg","bg":"patio","chars":[{"id":"carlos","x":80,"y":80}],"caption":"Universidad"},{"t":"narr","text":"Carlos atraviesa un pequeño patio universitario y entra al aula."},{"t":"bg","bg":"aula","chars":[{"id":"carlos","x":66,"y":74},{"id":"pablo","x":96,"y":74}]},{"t":"narr","text":"Durante la clase, Carlos copia números sin procesarlos. En una esquina de su cuaderno escribe:"},{"t":"narr","kind":"nota","text":"3,850 − 3,500 = 350"},{"t":"say","who":"Pablo","text":"Entonces, ¿vas el sábado?"},{"t":"say","who":"Carlos","text":"No sé todavía."},{"t":"say","who":"Pablo","text":"Van a ir unos de Mercadeo también. Una chava dijo que conoce una empresa buscando practicantes."},{"t":"narr","text":"Carlos levanta la mirada."},{"t":"say","who":"Carlos","text":"¿Practicantes pagados?"},{"t":"say","who":"Pablo","text":"Eso dijo. Pero si no podés ir, tranquilo, Carlos. Te paso la info después."},{"t":"narr","text":"Pablo lo dice sinceramente. No intenta presionarlo, pero Carlos no quiere admitir que L 250 pueden cambiarle la semana."},{"t":"narr","text":"El profesor continúa hablando. El portal de pagos sigue abierto en el teléfono."},{"t":"goto","scene":"d1"}]},"d1":{"steps":[{"t":"choice","id":"D1","prompt":"¿Qué protegés primero?","hint":"Efectivo: L 3,850 · Mensualidad: L 3,500 · Salida con Pablo: ~L 250","options":[{"label":"Pagar toda la universidad y no salir","costo":"Universidad −L 3,500 · Te quedan L 350","fx":{"add":{"cash":-3500,"educacion":15,"estres":4,"rel_pablo":-2},"flags":{"univ":"paid","ruta":"A"}},"goto":"d1_a"},{"label":"Pagar la universidad, hacer una recarga básica y proponer algo barato","costo":"Universidad −L 3,500 · Recarga −L 100 · Comida −L 100 · Te quedan L 150","fx":{"add":{"cash":-3700,"datos":40,"educacion":15,"conocimiento":8,"rel_pablo":3,"estres":5},"flags":{"univ":"paid","ruta":"B","conoce_fabiana":true}},"goto":"d1_b"},{"label":"Hacer un pago parcial y conservar liquidez","costo":"Universidad −L 3,000 · Recarga −L 150 · Ramen −L 250 · Te quedan L 450 · Quedan L 500 pendientes (+L 200 de recargo si no se pagan mañana)","fx":{"add":{"cash":-3400,"datos":90,"educacion":4,"rel_pablo":5,"estres":8},"set":{"deuda_univ":500},"flags":{"univ":"parcial","ruta":"C","conoce_fabiana":true}},"goto":"d1_c"},{"label":"Posponer la universidad hasta el próximo pago","costo":"Recarga −L 150 · Ramen −L 250 · Te quedan L 3,450 · Riesgo de bloqueo del portal","fx":{"add":{"cash":-400,"datos":90,"educacion":-12,"rel_pablo":5,"estres":12},"set":{"deuda_univ":3500},"flags":{"univ":"vencido","ruta":"D","conoce_fabiana":true}},"goto":"d1_d"}]}]},"d1_a":{"steps":[{"t":"narr","text":"Carlos paga. El botón por fin hace algo."},{"t":"msg","who":"Carlos","text":"Pablo, esta vez no voy a poder. Tengo que cubrir la mensualidad."},{"t":"msg","who":"Pablo","text":"Todo bien, Carlos. Te guardo para la próxima y te paso lo de la práctica."},{"t":"narr","text":"No hay castigo inmediato ni se rompe la amistad."},{"t":"goto","scene":"s4a"}]},"d1_b":{"steps":[{"t":"narr","text":"Carlos paga la mensualidad, hace una recarga básica y respira hondo."},{"t":"msg","who":"Carlos","text":"Pablo, el ramen se me sale del presupuesto. ¿Y si comemos algo en el kiosco de la U?"},{"t":"msg","who":"Pablo","text":"¡Cheque! Le aviso a los demás."},{"t":"narr","text":"Carlos mantiene su límite sin aislarse."},{"t":"goto","scene":"s4b"}]},"d1_c":{"steps":[{"t":"narr","text":"Carlos transfiere L 3,000 y hace una recarga completa. No resuelve la cuenta del todo, pero conserva algo de efectivo para emergencias."},{"t":"msg","who":"Carlos","text":"Me apunto. Nos vemos el sábado."},{"t":"msg","who":"Pablo","text":"¡Cheque, Carlos!"},{"t":"narr","text":"En el portal queda una línea que Carlos intenta no leer: “Saldo pendiente: L 500.”"},{"t":"goto","scene":"corte_viernes"}]},"d1_d":{"steps":[{"t":"narr","text":"Carlos cierra el portal sin pagar. Por ahora, el dinero se queda con él."},{"t":"msg","who":"Carlos","text":"Me apunto. Nos vemos el sábado."},{"t":"msg","who":"Pablo","text":"¡Cheque, Carlos!"},{"t":"goto","scene":"corte_viernes"}]},"corte_viernes":{"_nuevo":"Puente de tiempo añadido para que el vencimiento (viernes 5:00 p. m.) ocurra antes del sábado.","steps":[{"t":"bg","bg":"negro","caption":"Viernes, 5:01 p. m."},{"t":"if","cond":{"flag":"univ","eq":"parcial"},"then":[{"t":"fx","fx":{"add":{"deuda_univ":200}}},{"t":"msg","who":"Universidad","text":"Recargo aplicado: L 200. Saldo pendiente: L 700."},{"t":"narr","text":"Ayer eran L 500. Hoy son L 700."}],"else":[{"t":"msg","who":"Universidad","text":"Pago vencido. Algunas funciones del portal serán restringidas."}]},{"t":"goto","scene":"s4c"}]},"s4a":{"steps":[{"t":"bg","bg":"casa_dia","chars":[{"id":"helena","x":64,"y":74},{"id":"carlos","x":82,"y":74}],"caption":"Casa — Sábado, 5:36 p. m."},{"t":"narr","text":"Carlos está ayudando a Helena con su tarea. En el teléfono aparecen fotografías del grupo, pero Pablo también le envía el enlace de la práctica, cumpliendo su palabra."},{"t":"msg","who":"Pablo","text":"Mirá, Carlos, esta es. Cierra mañana."},{"t":"narr","text":"Carlos guarda el enlace."},{"t":"chars","list":[{"id":"helena","x":64,"y":74},{"id":"carlos","x":82,"y":74},{"id":"victoria","x":24,"y":78}]},{"t":"narr","text":"La puerta se abre. Victoria entra más pálida de lo normal. Deja su bolso y una pequeña bolsa de compras sobre la mesa."},{"t":"say","who":"Carlos","text":"Ma, ¿estás bien?"},{"t":"say","who":"Victoria","text":"Solo estoy cansada, mijo. Hoy llegaron dos camiones y faltó gente."},{"t":"narr","text":"Intenta levantar la bolsa. Pierde el equilibrio."},{"t":"narr","text":"Carlos alcanza a sostenerla antes de que golpee el piso."},{"t":"say","who":"Carlos","text":"¡Helena, traé agua! ¡Ma, escuchame!"},{"t":"narr","text":"Carlos llama a emergencias y después a una vecina que tiene carro. Logran llevarla rápidamente a una clínica cercana."},{"t":"fx","fx":{"add":{"familia":10,"estres":15},"flags":{"respuesta":"rapido"}}},{"t":"goto","scene":"clinica"}]},"s4b":{"steps":[{"t":"bg","bg":"kiosco","chars":[{"id":"carlos","x":100,"y":74},{"id":"pablo","x":120,"y":74},{"id":"fabiana","x":138,"y":74}],"caption":"Kiosco universitario — Sábado, 5:20 p. m."},{"t":"narr","text":"Pablo llega con Fabiana, una estudiante de Mercadeo que también trabaja mientras estudia."},{"t":"say","who":"Pablo","text":"Fabiana, él es Carlos, mi alero. El que logró bajarnos el presupuesto."},{"t":"say","who":"Fabiana","text":"Entonces ya hizo más por nuestras finanzas que la universidad."},{"t":"narr","text":"Carlos se ríe por primera vez en el día."},{"t":"say","who":"Fabiana","text":"¿Vos estudiás Finanzas, verdad?"},{"t":"say","who":"Carlos","text":"Sí. Aunque hoy casi pierdo contra una resta."},{"t":"say","who":"Fabiana","text":"Las restas de uno siempre son más difíciles."},{"t":"narr","text":"Fabiana le explica que en su trabajo buscan un practicante administrativo. No garantiza nada, pero se ofrece a enviarle el contacto."},{"t":"narr","text":"El teléfono de Carlos suena. Es Helena."},{"t":"say","who":"Carlos","text":"¿Hola?"},{"t":"narr","text":"La expresión le cambia."},{"t":"say","who":"Helena","text":"Carlos, mamá se cayó. Está despierta, pero no se puede levantar bien."},{"t":"narr","text":"Fabiana escucha solamente lo suficiente para entender."},{"t":"say","who":"Fabiana","text":"Mi primo anda cerca y tiene carro. Él te da el raite, ya le escribo."},{"t":"narr","text":"Carlos acepta la ayuda. Gracias a esa nueva conexión llega pronto a la clínica."},{"t":"fx","fx":{"add":{"rel_fabiana":12,"familia":5,"estres":15},"flags":{"practica":true,"respuesta":"medio"}}},{"t":"goto","scene":"clinica"}]},"s4c":{"steps":[{"t":"bg","bg":"ramen","chars":[{"id":"carlos","x":56,"y":74},{"id":"fabiana","x":82,"y":74},{"id":"pablo","x":108,"y":74}],"caption":"Restaurante — Sábado, 5:17 p. m."},{"t":"narr","text":"Carlos mira el menú. Los precios que había calculado mentalmente sí eran correctos, pero verlos impresos le provoca otra sensación."},{"t":"narr","text":"Fabiana, sentada frente a él, nota que aprieta el vaso con demasiada fuerza."},{"t":"say","who":"Fabiana","text":"Mirá, ¿estás bien?"},{"t":"say","who":"Carlos","text":"Sí. Solo estoy decidiendo si tengo hambre de L 180 o de L 280."},{"t":"narr","text":"Fabiana sonríe."},{"t":"say","who":"Fabiana","text":"Yo tengo hambre de L 120. Si algo aprendí trabajando y estudiando es que no voy a fingir que el pisto me ajusta."},{"t":"narr","text":"La sinceridad le quita presión a Carlos."},{"t":"say","who":"Carlos","text":"Carlos, por cierto."},{"t":"say","who":"Fabiana","text":"Fabiana."},{"t":"say","who":"Pablo","text":"Bueno, ya que se presentaron, ¿vamos a pedir o van a abrir una consultoría?"},{"t":"narr","text":"Todos se ríen. Fabiana cuenta que en su trabajo buscan un practicante administrativo. Se ofrece a enviarle el contacto."},{"t":"narr","text":"El teléfono de Carlos vibra. En la pantalla aparece: MAMÁ."},{"t":"choice","id":"D2","prompt":"¿Contestar o seguir en la mesa?","hint":"El teléfono vibra sobre la mesa.","options":[{"label":"Contestar inmediatamente","costo":"Te levantás de la mesa","fx":{},"goto":"s4c_contesta"},{"label":"Silenciar la llamada","costo":"La devolvés en cinco minutos","fx":{},"goto":"s4c_silencia"}]}]},"s4c_contesta":{"steps":[{"t":"narr","text":"Carlos se disculpa y responde."},{"t":"say","who":"Helena","text":"Carlos, mamá se cayó. Una vecina está con nosotros."},{"t":"narr","text":"Carlos se levanta. Fabiana consigue transporte con un familiar que está cerca."},{"t":"fx","fx":{"add":{"familia":5,"rel_fabiana":8},"flags":{"practica":true,"respuesta":"medio"}}},{"t":"goto","scene":"clinica"}]},"s4c_silencia":{"steps":[{"t":"narr","text":"Carlos piensa que puede devolverla en cinco minutos. La conversación continúa hasta que ve tres llamadas perdidas y un mensaje de Helena:"},{"t":"msg","who":"Helena","text":"Mamá se desmayó. Vamos para una clínica."},{"t":"narr","text":"Carlos se pone de pie tan rápido que golpea la mesa."},{"t":"say","who":"Fabiana","text":"¿Qué pasó?"},{"t":"say","who":"Carlos","text":"Mi mamá. Me estaba llamando y yo…"},{"t":"say","who":"Fabiana","text":"Explicás después. Vamos."},{"t":"narr","text":"Fabiana consigue transporte. Carlos obtiene una relación y una oportunidad que no habría tenido en casa, pero llega más tarde y debe enfrentar la confianza que perdió."},{"t":"fx","fx":{"add":{"familia":-10,"estres":22,"rel_fabiana":10},"flags":{"practica":true,"respuesta":"lento","silenciada":true}}},{"t":"goto","scene":"clinica"}]},"clinica":{"steps":[{"t":"bg","bg":"clinica","chars":[{"id":"carlos","x":62,"y":82},{"id":"helena","x":98,"y":82}],"caption":"Clínica"},{"t":"explore","objective":"Esperar noticias de Victoria.","spots":[{"id":"helena","label":"Helena","x":98,"y":62,"steps":[{"t":"if","cond":{"flag":"silenciada"},"then":[{"t":"say","who":"Helena","text":"Te llamamos tres veces."},{"t":"say","who":"Carlos","text":"Lo sé. Lo siento."},{"t":"say","who":"Helena","text":"Yo no sabía qué hacer."},{"t":"narr","text":"No hay una reconciliación inmediata."}],"else":[{"t":"say","who":"Helena","text":"Pensé que no se iba a despertar."},{"t":"say","who":"Carlos","text":"Hiciste bien en llamar. No fue tu culpa."}]}]},{"id":"portal","label":"Teléfono","x":62,"y":62,"steps":[{"t":"if","cond":{"flag":"univ","eq":"paid"},"then":[{"t":"phone","title":"Portal universitario","lines":["Saldo: L 0.","Pago recibido."]}],"else":[{"t":"if","cond":{"flag":"univ","eq":"parcial"},"then":[{"t":"phone","title":"Portal universitario","lines":["Saldo pendiente: L 700.","Incluye recargo de L 200."]}],"else":[{"t":"phone","title":"Portal universitario","lines":["Pago vencido.","Funciones del portal restringidas."]}]}]}]},{"id":"maquina","label":"Máquina","x":133,"y":42,"steps":[{"t":"narr","text":"Una máquina de bebidas. Carlos la mira un momento y no compra nada."}]},{"id":"mostrador","label":"Mostrador","x":26,"y":46,"ste function drawChar(R,id,x,y,bob){
  const c=CH[id];if(!c)return;
  const Lg=c.kid?4:6,T=c.kid?5:7,Hh=6;
  R('rgba(0,0,0,.28)',x-5,y,10,1);
  R(c.pants,x-3,y-Lg,3,Lg);R(c.pants,x,y-Lg,3,Lg);R('#15121c',x-3,y-1,3,1);R('#15121c',x,y-1,3,1);
  const ty=y-bob-Lg-T;
  R(c.shirt,x-4,ty,8,T);R(c.skin,x-5,ty+1,1,T-2);R(c.skin,x+4,ty+1,1,T-2);
  const hy=ty-Hh;
  R(c.skin,x-3,hy,6,Hh);R(c.hair,x-3,hy,6,2);
  if(c.style==='long'){R(c.hair,x-4,hy,1,Hh+3);R(c.hair,x+3,hy,1,Hh+3)}
  else if(c.style==='bun'){R(c.hair,x-1,hy-2,3,2);R(c.hair,x-4,hy,1,3);R(c.hair,x+3,hy,1,3)}
  else if(c.style==='spiky'){R(c.hair,x-3,hy-1,2,1);R(c.hair,x,hy-2,2,2);R(c.hair,x+2,hy-1,1,1);R(c.hair,x-4,hy,1,2);R(c.hair,x+3,hy,1,2)}
  else{R(c.hair,x-4,hy,1,3);R(c.hair,x+3,hy,1,3)}
  R('#1a1210',x-2,hy+3,1,1);R('#1a1210',x+1,hy+3,1,1);
}

const layerCache={};
function layers(key){
  if(layerCache[key])return layerCache[key];
  const fn=SC[key]||SC.negro;
  const mk=L=>{const c=mkCanvas(W,H);const g=c.getContext('2d');const R=(col,x,y,w,h)=>{g.fillStyle=col;g.fillRect(x,y,w,h)};fn(R,L);return c};
  return layerCache[key]={bg:mk('bg'),fg:mk('fg')};
}
function renderScene(g,key,chars,frame,speaker){
  const l=layers(key);
  g.drawImage(l.bg,0,0);
  const R=(col,x,y,w,h)=>{g.fillStyle=col;g.fillRect(x,y,w,h)};
  chars.slice().sort((a,b)=>a.y-b.y).forEach(ch=>{
    const talk=ch.id===speaker;
    const bob=talk?(frame%2):((((frame>>2)+(ch.x|0))%3)===0?1:0);
    drawChar(R,ch.id,ch.x,ch.y,bob);
  });
  g.drawImage(l.fg,0,0);
}

<script>
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const KEY='saldo_pendiente_cap1_v1',DEVKEY='saldo_pendiente_dev';
const cv=$('cv'),g=cv.getContext('2d'),panel=$('panel'),spotsEl=$('spots'),toasts=$('toasts'),sheet=$('sheet');
if(g)g.imageSmoothingEnabled=false;

const NAMECOL={Carlos:'#c9871a',Helena:'#cf4a86',Victoria:'#2a9467',Pablo:'#cf6a22',Fabiana:'#8a4fc4'};
const fmtL=n=>'L '+String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const sgn=n=>(n<0?'−':'+')+fmtL(n);
const PCT=new Set(['educacion','familia','estres','rel_pablo','rel_fabiana','datos','conocimiento','carrera']);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

let S,stack=[],onTap=null,typing=null,dev=false,frame=0;
let view={key:'negro',chars:[],speaker:null};
try{dev=localStorage.getItem(DEVKEY)==='1'}catch(e){}

/* ---------- state ---------- */
const newState=()=>({scene:null,vars:{...STORY.config.vars},flags:{...STORY.config.flags},history:[]});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({scene:S.scene,vars:S.vars,flags:S.flags,history:S.history}))}catch(e){}};
const loadSave=()=>{try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}};
const clearSave=()=>{try{localStorage.removeItem(KEY)}catch(e){}};

function test(c){
  if(!c)return true;
  if(c.all)return c.all.every(test);
  if(c.any)return c.any.some(test);
  if(c.not)return !test(c.not);
  if(c.flag!==undefined){const v=S.flags[c.flag];if('eq' in c)return v===c.eq;if('ne' in c)return v!==c.ne;return !!v}
  if(c.var!==undefined){const v=S.vars[c.var];
    if('gte' in c)return v>=c.gte;if('lte' in c)return v<=c.lte;if('gt' in c)return v>c.gt;if('lt' in c)return v<c.lt;if('eq' in c)return v===c.eq}
  return true;
}

/* ---------- hud + feedback ---------- */
function updateHud(){
  $('cash').textContent=fmtL(S.vars.cash);
  $('b-edu').style.width=S.vars.educacion+'%';
  $('b-fam').style.width=S.vars.familia+'%';
  $('b-est').style.width=S.vars.estres+'%';
  document.querySelector('.bar.est').classList.toggle('hi',S.vars.estres>=70);
}
function toast(text,cls){
  const d=document.createElement('div');d.className='chip '+(cls||'');d.textContent=text;toasts.appendChild(d);
  while(toasts.children.length>5)toasts.removeChild(toasts.firstChild);
  setTimeout(()=>{if(d.parentNode)d.parentNode.removeChild(d)},3100);
}
const LBL={educacion:'Educación',familia:'Familia',estres:'Estrés',conocimiento:'Conocimiento financiero',carrera:'Carrera'};
function chipFor(k,d,isSet,nv){
  if(k==='cash')return [`Efectivo ${sgn(d)}`,d<0?'neg':'pos'];
  if(k==='rel_pablo')return ['Pablo lo recordará','rel'];
  if(k==='rel_fabiana')return ['Fabiana lo recordará','rel'];
  if(k==='estres')return [`Estrés ${d>0?'+':'−'}${Math.abs(d)}`,d>0?'neg':'pos'];
  if(LBL[k])return [`${LBL[k]} ${d>0?'+':'−'}${Math.abs(d)}`,d>0?'pos':'neg'];
  if(k==='deuda_univ')return [isSet?`Saldo universitario: ${fmtL(nv)}`:`Saldo universitario ${sgn(d)}`,'neg'];
  if(k==='deuda_salarial')return [`Adelanto por devolver: ${fmtL(nv)}`,'neg'];
  if(k==='deuda_familiar')return [`Deuda con mamá: ${fmtL(nv)}`,'neg'];
  if(k==='ahorro_familiar')return [`Ahorro familiar ${sgn(d)}`,'neg'];
  return null;
}
function applyFx(fx){
  if(!fx)return;const chips=[];
  for(const [k,d] of Object.entries(fx.add||{})){
    const old=S.vars[k]??0;let nv=old+d;if(PCT.has(k))nv=Math.max(0,Math.min(100,nv));
    S.vars[k]=nv;const c=chipFor(k,nv-old,false,nv);if(c&&nv!==old)chips.push(c);
  }
  for(const [k,v] of Object.entries(fx.set||{})){
    const old=S.vars[k]??0;S.vars[k]=v;const c=chipFor(k,v-old,true,v);if(c&&v!==old)chips.push(c);
  }
  for(const [k,v] of Object.entries(fx.flags||{}))S.flags[k]=v;
  updateHud();
  chips.forEach(c=>toast(c[0],c[1]));
}
function describeFx(fx){
  if(!fx)return '';const p=[];
  for(const [k,d] of Object.entries(fx.add||{}))p.push(`${k} ${d>0?'+':''}${d}`);
  for(const [k,v] of Object.entries(fx.set||{}))p.push(`${k} = ${v}`);
  for(const [k,v] of Object.entries(fx.flags||{}))p.push(`${k}: ${v}`);
  return p.join(' · ');
}

/* ---------- stage ---------- */
function draw(){if(g)renderScene(g,view.key,view.chars,frame,view.speaker)}
setInterval(()=>{frame++;draw()},reduce?1000:240);
function setBg(s){
  view.key=s.bg;view.chars=(s.chars||[]).map(c=>({...c}));view.speaker=null;
  cv.classList.remove('fade');void cv.offsetWidth;cv.classList.add('fade');
  if(s.caption)showCaption(s.caption);
  draw();
}
function showCaption(t){
  const old=$('stage').querySelector('.cap');if(old)old.remove();
  const d=document.createElement('div');d.className='cap';d.textContent=t;$('stage').appendChild(d);
}
const hideSpots=()=>{spotsEl.innerHTML=''};

/* ---------- panel renderers ---------- */
function typeInto(el,text){
  if(reduce||!text.length){el.textContent=text;typing=null;return}
  let i=0,t;
  typing={finish(){clearTimeout(t);el.textContent=text;typing=null}};
  const tick=()=>{i++;el.textContent=text.slice(0,i);if(i>=text.length){typing=null;return}t=setTimeout(tick,13)};
  tick();
}
function mount(node){panel.innerHTML='';panel.appendChild(node);panel.scrollTop=0}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function arrow(){return el('span','arrow','▼')}

const H={
  bg(s){setBg(s)},
  chars(s){view.chars=s.list.map(c=>({...c}));draw()},
  fx(s){applyFx(s.fx)},
  if(s){const b=test(s.cond)?s.then:s.else;if(b&&b.length)stack.push({steps:b,i:0})},
  goto(s){run(s.scene);return false},
  narr(s){
    const kind=s.kind||'narr';const b=el('div','box '+kind);const t=el('div','txt');b.append(t,arrow());
    view.speaker=null;mount(b);typeInto(t,s.text);onTap=step;return false;
  },
  say(s){
    const b=el('div','box say');const n=el('div','name',s.who);n.style.setProperty('--c',NAMECOL[s.who]||'#5b6178');
    const t=el('div','txt');b.append(n,t,arrow());view.speaker=norm(s.who);mount(b);typeInto(t,s.text);onTap=step;return false;
  },
  msg(s){
    view.speaker=null;
    const wrap=el('div','box msg'+(s.who==='Carlos'?' self':''));
    wrap.append(el('div','who',s.who==='Carlos'?'Tú escribes':'Mensaje de '+s.who));
    const bub=el('div','bubble');const t=el('div','txt');bub.appendChild(t);wrap.append(bub,arrow());
    mount(wrap);typeInto(t,s.text);onTap=step;return false;
  },
  phone(s){
    view.speaker=null;const p=el('div','phone');p.appendChild(el('h4',null,s.title));
    s.lines.forEach(l=>p.appendChild(el('p',null,l)));
    if(s.button)p.appendChild(el('div','pay',s.button));
    p.appendChild(arrow());mount(p);onTap=step;return false;
  },
  card(s){
    view.speaker=null;const c=el('div','card');c.appendChild(el('h4',null,s.title));
    s.lines.forEach(([a,b])=>{const r=el('div','row');r.append(el('span',null,a),el('span',null,b));c.appendChild(r)});
    const t=el('div','tot');t.append(el('span',null,s.total[0]),el('span',null,s.total[1]));c.append(t,arrow());
    mount(c);onTap=step;return false;
  },
  news(s){
    view.speaker=null;const c=el('div','card news');c.appendChild(el('h4',null,s.section));
    c.appendChild(el('div','hl',s.title));c.appendChild(el('p','bj',s.text));c.appendChild(arrow());
    mount(c);onTap=step;return false;
  },
  title(s){
    view.speaker=null;const d=el('div','titlecard');d.append(el('h1',null,s.text),el('p',null,s.sub||''),arrow());
    mount(d);onTap=step;return false;
  },
  explore(s){stack.push({explore:s,visited:new Set(),steps:[],i:0})},
  choice(s){renderChoice(s);return false},
  recap(){renderRecap();return false},
  end(s){renderEnd(s);return false}
};

function renderExplore(f){
  const s=f.explore;onTap=null;view.speaker=null;
  hideSpots();
  s.spots.forEach(sp=>{
    const b=el('button','spot'+(f.visited.has(sp.id)?' done':''));b.type='button';
    b.style.left=(sp.x/160*100)+'%';b.style.top=(sp.y/90*100)+'%';
    b.setAttribute('aria-label',sp.label);b.appendChild(el('span','lbl',sp.label));
    b.addEventListener('click',e=>{e.stopPropagation();f.visited.add(sp.id);hideSpots();stack.push({steps:sp.steps,i:0});step()});
    spotsEl.appendChild(b);
  });
  const w=el('div');
  const o=el('div','obj');o.append(el('b',null,'Objetivo'),el('span',null,s.objective));
  w.appendChild(o);
  w.appendChild(el('p','tip','Tocá los puntos que brillan en la escena.'));
  const ex=s.exit||{label:'Continuar'};
  const need=(ex.requires||[]).filter(id=>!f.visited.has(id));
  const eb=el('button','opt exit');eb.type='button';eb.append(el('span','lab',ex.label));
  if(need.length){eb.disabled=true;eb.appendChild(el('span','why',ex.requiresText||'Todavía falta algo por revisar.'))}
  eb.addEventListener('click',e=>{e.stopPropagation();hideSpots();stack.pop();step()});
  w.appendChild(eb);mount(w);
}

function renderChoice(s){
  onTap=null;view.speaker=null;
  const w=el('div');w.appendChild(el('p','q',s.prompt));
  if(s.hint)w.appendChild(el('p','hint',s.hint));
  s.options.forEach(o=>{
    const ok=test(o.when);
    const b=el('button','opt');b.type='button';b.appendChild(el('span','lab',o.label));
    if(o.costo)b.appendChild(el('span','cost',o.costo));
    if(dev&&o.fx&&ok)b.appendChild(el('span','dev',describeFx(o.fx)));
    if(!ok){b.disabled=true;b.appendChild(el('span','why',o.whenText||'No disponible.'))}
    b.addEventListener('click',e=>{
      e.stopPropagation();
      w.querySelectorAll('button').forEach(x=>x.disabled=true);
      S.history.push({id:s.id,label:o.label});
      applyFx(o.fx);run(o.goto);
    });
    w.appendChild(b);
  });
  mount(w);
}

function recapRows(){
  const v=S.vars,f=S.flags;const rows=[];
  rows.push(['sec','Dinero']);
  rows.push(['Efectivo disponible',fmtL(v.cash)]);
  rows.push(['Saldo universitario',v.deuda_univ>0?fmtL(v.deuda_univ)+(f.univ==='vencido'?' (vencido)':''):'L 0']);
  rows.push(['Deudas',(v.deuda_salarial+v.deuda_familiar)>0?[v.deuda_salarial>0?`${fmtL(v.deuda_salarial)} al supermercado`:'',v.deuda_familiar>0?`${fmtL(v.deuda_familiar)} a mamá`:''].filter(Boolean).join(' · '):'Ninguna']);
  rows.push(['sec','Vos y los tuyos']);
  rows.push(['Familia',v.familia+'/100']);
  rows.push(['Estrés',v.estres+'/100']);
  rows.push(['Relaciones desbloqueadas',['Pablo',f.conoce_fabiana?'Fabiana':''].filter(Boolean).join(' · ')]);
  rows.push(['Oportunidad',(f.practica||f.ruta==='A')?'Práctica por revisar':'Ninguna por ahora']);
  rows.push(['sec','Lo que ya está comprometido']);
  const c=[];
  const next=v.pago_quincenal-(f.adelanto?500:0);
  c.push(['Próximo pago (en 6 días)',fmtL(next)]);
  if(f.adelanto)c.push(['Adelanto salarial','3 pagos de −L 500']);
  if(v.deuda_familiar>0)c.push(['Deuda con mamá',fmtL(v.deuda_familiar)]);
  if(v.deuda_univ>0)c.push(['Universidad',fmtL(v.deuda_univ)]);
  if(f.victoria_pago)c.push(['Ahorro familiar','Agotado: alquiler, transporte y útiles de Helena expuestos']);
  return rows.concat(c);
}
function renderRecap(){
  onTap=step;view.speaker=null;
  const b=el('div','box narr');const ul=el('ul','recap');
  recapRows().forEach(r=>{
    if(r[0]==='sec'){ul.appendChild(el('li','sec',r[1]));return}
    const li=el('li');li.append(el('span',null,r[0]),el('em',null,r[1]));ul.appendChild(li);
  });
  b.append(ul,arrow());mount(b);
}
function summaryText(){
  const v=S.vars;
  const lines=['Saldo pendiente — Capítulo 1 (prototipo)','','Mis decisiones:'];
  S.history.forEach(h=>lines.push('• '+h.label));
  lines.push('','Resultado: Efectivo '+fmtL(v.cash)+' · Universidad '+fmtL(v.deuda_univ)+' · Deudas '+fmtL(v.deuda_salarial+v.deuda_familiar)+' · Familia '+v.familia+'/100 · Estrés '+v.estres+'/100');
  lines.push('','¿Qué decisión se sintió más real?');
  return lines.join('\n');
}
function renderEnd(s){
  onTap=null;view.speaker=null;
  const w=el('div','menu');
  w.append(el('h1',null,'Continuará'),el('p','sub',s.next||''));
  const sh=el('button','opt');sh.type='button';sh.appendChild(el('span','lab','Compartir mi resultado'));
  const msg=el('p','small','Mandáselo a quien te pasó el juego y contale qué decisión se sintió más real.');
  sh.addEventListener('click',async e=>{
    e.stopPropagation();const text=summaryText();
    try{
      if(navigator.share){await navigator.share({text});}
      else if(navigator.clipboard){await navigator.clipboard.writeText(text);msg.textContent='Copiado. Pegalo en WhatsApp.';}
      else{msg.textContent=text;}
    }catch(err){msg.textContent='No se pudo compartir. Este es tu resumen:\n\n'+text;msg.style.whiteSpace='pre-wrap'}
  });
  const rp=el('button','opt');rp.type='button';rp.appendChild(el('span','lab','Jugar de nuevo'));
  rp.addEventListener('click',e=>{e.stopPropagation();startGame()});
  w.append(sh,rp,msg);
  if(dev){const pre=el('pre');pre.style.cssText='text-align:left;font-size:16px;color:#9fe0ff;white-space:pre-wrap';pre.textContent=JSON.stringify({vars:S.vars,flags:S.flags,history:S.history},null,1);w.appendChild(pre)}
  clearSave();mount(w);
}

/* ---------- engine ---------- */
function step(){
  for(;;){
    const f=stack[stack.length-1];
    if(!f)return;
    if(f.explore){renderExplore(f);return}
    if(f.i>=f.steps.length){stack.pop();continue}
    const s=f.steps[f.i++];const h=H[s.t];
    if(!h){console.warn('Paso desconocido',s);continue}
    if(h(s)===false)return;
  }
}
function run(id){
  const sc=STORY.escenas[id];
  if(!sc){console.error('Escena no encontrada:',id);return}
  S.scene=id;if(id!=='cine')save();
  stack=[{steps:sc.steps,i:0}];hideSpots();step();
}

/* ---------- input ---------- */
function tap(){
  if(sheet.classList.contains('open'))return;
  if(typing){typing.finish();return}
  if(onTap){const f=onTap;onTap=null;f()}
}
panel.addEventListener('click',tap);
$('stage').addEventListener('click',tap);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&sheet.classList.contains('open')){sheet.classList.remove('open');return}
  if((e.key===' '||e.key==='Enter')&&!(document.activeElement&&document.activeElement.tagName==='BUTTON')){e.preventDefault();tap()}
});

/* ---------- estado sheet ---------- */
function openSheet(){
  if(!S)return;
  sheet.innerHTML='';sheet.appendChild(el('h2',null,'Estado de Carlos'));
  const v=S.vars,f=S.flags;
  const ul=el('ul','recap');
  const add=(a,b)=>{const li=el('li');li.append(el('span',null,a),el('em',null,b));ul.appendChild(li)};
  const sec=t=>ul.appendChild(el('li','sec',t));
  sec('Dinero');add('Efectivo',fmtL(v.cash));add('Ahorro',fmtL(v.ahorro));
  add('Saldo universitario',v.deuda_univ>0?fmtL(v.deuda_univ):(f.univ==='paid'?'Al día':'L 0'));
  if(v.deuda_salarial>0)add('Adelanto salarial',fmtL(v.deuda_salarial));
  if(v.deuda_familiar>0)add('Deuda con mamá',fmtL(v.deuda_familiar));
  add('Datos móviles',v.datos+'%');
  sec('Vos');add('Educación',v.educacion+'/100');add('Familia',v.familia+'/100');add('Estrés',v.estres+'/100');
  if(v.conocimiento>0)add('Conocimiento financiero',v.conocimiento+'/100');
  sec('Relaciones');add('Pablo',v.rel_pablo+'/100');if(f.conoce_fabiana)add('Fabiana',v.rel_fabiana+'/100');
  sheet.appendChild(ul);
  const gloss=STORY.voces&&STORY.voces.glosario;
  if(gloss){
    sheet.appendChild(el('h2',null,'Habla catracha'));
    const gl=el('ul','recap');
    Object.entries(gloss).forEach(([k,v])=>{if(k[0]==='_')return;const li=el('li');li.append(el('span',null,k),el('em',null,v));gl.appendChild(li)});
    sheet.appendChild(gl);
  }
  if(dev){
    sheet.appendChild(el('h2',null,'Modo prueba'));
    const act=(STORY.mapa_consecuencias||[]).filter(c=>test(c.si)).map(c=>'• '+c.entonces);
    const pre=el('pre');pre.textContent='Escena: '+S.scene+'\n\nBanderas:\n'+JSON.stringify(S.flags,null,1)+'\n\nConsecuencias activas:\n'+(act.join('\n')||'—');
    sheet.appendChild(pre);
  }
  const c=el('button','opt','Cerrar');c.type='button';c.addEventListener('click',e=>{e.stopPropagation();sheet.classList.remove('open')});
  sheet.appendChild(c);sheet.classList.add('open');
}
$('btn-estado').addEventListener('click',e=>{e.stopPropagation();openSheet()});

/* ---------- start ---------- */
function startGame(){
  S=newState();updateHud();clearSave();run(STORY.meta.inicio);
}
function continueGame(sv){
  S=newState();S.vars={...S.vars,...sv.vars};S.flags={...S.flags,...sv.flags};S.history=sv.history||[];
  updateHud();run(sv.scene);
}
function renderMenu(){
  S=S||newState();updateHud();
  view={key:'habitacion',chars:[{id:'carlos',x:80,y:84}],speaker:null};draw();
  const sv=loadSave();
  const w=el('div','menu');
  w.append(el('h1',null,'Saldo pendiente'),el('p','sub','Capítulo 1 · Prototipo'));
  const go=el('button','opt');go.type='button';go.appendChild(el('span','lab','Empezar'));
  go.addEventListener('click',e=>{e.stopPropagation();startGame()});w.appendChild(go);
  if(sv&&sv.scene){
    const ct=el('button','opt');ct.type='button';ct.appendChild(el('span','lab','Continuar'));
    ct.addEventListener('click',e=>{e.stopPropagation();continueGame(sv)});w.appendChild(ct);
  }
  const dv=el('button','opt');dv.type='button';dv.appendChild(el('span','lab','Modo prueba: '+(dev?'sí':'no')));
  dv.addEventListener('click',e=>{e.stopPropagation();dev=!dev;try{localStorage.setItem(DEVKEY,dev?'1':'0')}catch(err){}renderMenu()});
  w.appendChild(dv);
  w.appendChild(el('p','small','Cada decisión cambia tu dinero, tu tiempo y tus relaciones. Se guarda sola. Todos los personajes, negocios, instituciones y montos son ficticios.'));
  onTap=null;mount(w);
}
renderMenu();
window.__saldo={state:()=>S,step,tap};
})();
</script>
